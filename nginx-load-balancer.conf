# ============================================================================
# NGINX LOAD BALANCER CONFIGURATION
# Hospital Management System - Performance & Scalability
# ============================================================================
# This file implements intelligent load balancing for hospital services

# Main context
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Worker connections optimization
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ============================================================================
    # 1. BASIC CONFIGURATION
    # ============================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format for hospital system
    log_format hospital_access '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rt=$request_time uct="$upstream_connect_time" '
                              'uht="$upstream_header_time" urt="$upstream_response_time" '
                              'server="$upstream_addr" user_id="$http_x_user_id"';

    access_log /var/log/nginx/access.log hospital_access;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ============================================================================
    # 2. UPSTREAM DEFINITIONS
    # ============================================================================

    # Main application servers
    upstream hospital_app_servers {
        least_conn;
        server hospital-app-1:3000 weight=3 max_fails=3 fail_timeout=30s;
        server hospital-app-2:3000 weight=3 max_fails=3 fail_timeout=30s;
        server hospital-app-3:3000 weight=3 max_fails=3 fail_timeout=30s;
        
        # Health check
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # API Gateway servers
    upstream hospital_api_gateway {
        ip_hash; # Sticky sessions for API consistency
        server hospital-api-gateway-1:3100 weight=2 max_fails=2 fail_timeout=20s;
        server hospital-api-gateway-2:3100 weight=2 max_fails=2 fail_timeout=20s;
        
        keepalive 16;
    }

    # GraphQL servers
    upstream hospital_graphql {
        least_conn;
        server hospital-graphql-1:3200 weight=2 max_fails=2 fail_timeout=20s;
        server hospital-graphql-2:3200 weight=2 max_fails=2 fail_timeout=20s;
        
        keepalive 16;
    }

    # WebSocket servers (sticky sessions required)
    upstream hospital_websocket {
        ip_hash;
        server hospital-app-1:3000 weight=1;
        server hospital-app-2:3000 weight=1;
        server hospital-app-3:3000 weight=1;
    }

    # Static file servers
    upstream hospital_static {
        server hospital-static-1:8080 weight=1;
        server hospital-static-2:8080 weight=1;
    }

    # ============================================================================
    # 3. RATE LIMITING
    # ============================================================================

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;
    limit_req_zone $http_x_user_id zone=user_api:10m rate=1000r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn_zone $server_name zone=conn_limit_per_server:10m;

    # ============================================================================
    # 4. SECURITY HEADERS
    # ============================================================================
    
    # Security headers map
    map $sent_http_content_type $security_headers {
        ~*text/html "nosniff";
        default "";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ============================================================================
    # 5. MAIN SERVER CONFIGURATION
    # ============================================================================

    server {
        listen 80;
        server_name hospital.local *.hospital.local;
        
        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name hospital.local *.hospital.local;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/hospital.crt;
        ssl_certificate_key /etc/nginx/ssl/hospital.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Connection limits
        limit_conn conn_limit_per_ip 20;
        limit_conn conn_limit_per_server 1000;

        # ============================================================================
        # 6. LOCATION BLOCKS
        # ============================================================================

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API routes with rate limiting
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req zone=user_api burst=100 nodelay;
            
            proxy_pass http://hospital_api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # GraphQL endpoint
        location /graphql {
            limit_req zone=api burst=30 nodelay;
            
            proxy_pass http://hospital_graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # GraphQL specific timeouts
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Authentication endpoints with strict rate limiting
        location ~ ^/(auth|login|register|reset-password) {
            limit_req zone=auth burst=5 nodelay;
            
            proxy_pass http://hospital_app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Security headers for auth
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # File upload endpoints
        location ~ ^/(upload|files) {
            limit_req zone=upload burst=2 nodelay;
            
            client_max_body_size 100m;
            client_body_timeout 300s;
            
            proxy_pass http://hospital_app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Upload specific timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # WebSocket connections (sticky sessions)
        location /socket.io/ {
            proxy_pass http://hospital_websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific settings
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            proxy_buffering off;
        }

        # Static files with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://hospital_static;
            proxy_set_header Host $host;
            
            # Caching headers
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            
            # Compression
            gzip_static on;
        }

        # Main application
        location / {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://hospital_app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Standard timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Error pages
            error_page 502 503 504 /50x.html;
        }

        # Custom error pages
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ============================================================================
    # 7. MONITORING AND ADMIN SERVER
    # ============================================================================

    server {
        listen 8080;
        server_name admin.hospital.local;
        
        # Admin authentication required
        auth_basic "Hospital Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # NGINX status
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.20.0.0/16;
            deny all;
        }

        # Upstream status
        location /upstream_status {
            # Custom upstream status page
            proxy_pass http://hospital_app_servers/health;
            proxy_set_header Host $host;
        }

        # Load balancer metrics
        location /metrics {
            # Prometheus metrics endpoint
            access_log off;
            allow 172.20.0.0/16;
            deny all;
            
            content_by_lua_block {
                local prometheus = require "resty.prometheus"
                prometheus:collect()
            }
        }
    }
}

# ============================================================================
# 8. STREAM BLOCK FOR TCP/UDP LOAD BALANCING
# ============================================================================

stream {
    # Database load balancing (read replicas)
    upstream postgres_read {
        server postgres-replica:5432 weight=2;
        server postgres-primary:5432 weight=1 backup;
    }

    server {
        listen 5434;
        proxy_pass postgres_read;
        proxy_timeout 1s;
        proxy_responses 1;
    }

    # Redis cluster load balancing
    upstream redis_cluster {
        server redis-cluster:6379;
        server redis-cluster-2:6379 backup;
    }

    server {
        listen 6380;
        proxy_pass redis_cluster;
        proxy_timeout 1s;
        proxy_responses 1;
    }
}
